<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEKO · Zugänge verwalten</title>
<!--
  Benutzerverwaltung für Admins: Konten anlegen, Passwörter neu setzen,
  Zugänge sperren. Erreichbar nur für angemeldete Admins - geprüft wird das
  nicht hier, sondern in der Edge Function; diese Seite ist nur die Bedienung.
-->
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f8; color: #1c2530; margin: 0; padding: 16px 14px 40px; }
  .kopf { max-width: 640px; margin: 0 auto 16px; display: flex; align-items: center;
          justify-content: space-between; gap: 12px; }
  h1 { font-size: 21px; margin: 0; }
  .wer { font-size: 13px; color: #6b7785; }
  .karte { max-width: 640px; margin: 0 auto 12px; background: #fff; border-radius: 14px;
           padding: 15px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .name { font-weight: 600; font-size: 16px; }
  .status { font-size: 13px; color: #6b7785; margin-top: 3px; }
  .marke { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
           border-radius: 20px; vertical-align: middle; margin-left: 6px; }
  .m-admin { background: #e7effa; color: #1a4d8f; }
  .m-gesperrt { background: #fdeaea; color: #a3282c; }
  .m-neu { background: #fff4e0; color: #8a5a00; }
  button { border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; padding: 10px 14px;
           cursor: pointer; background: #1668c1; color: #fff; }
  button.klein { padding: 8px 11px; font-size: 13px; }
  button.grau { background: #eceff2; color: #34404c; }
  button.rot { background: #fdeaea; color: #a3282c; }
  button:disabled { opacity: .5; cursor: default; }
  .werkzeuge { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px;
               padding-top: 12px; border-top: 1px solid #eef1f4; }
  input { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #ccd3da;
          border-radius: 9px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #56626e;
          margin: 11px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .hinweis { font-size: 13px; color: #6b7785; line-height: 1.5; }
  .zettel { background: #fff8e6; border: 1px dashed #e0b357; border-radius: 10px;
            padding: 13px; margin-top: 13px; font-size: 15px; line-height: 1.7; }
  .zettel code { background: #fff; padding: 2px 7px; border-radius: 5px; font-size: 15px;
                 font-weight: 700; }
  dialog { border: 0; border-radius: 15px; padding: 20px; max-width: 400px; width: 92%;
           box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(20,28,36,.5); }
  .lade { text-align: center; color: #6b7785; padding: 30px; }
</style>
</head>
<body>

<div id="inhalt"><div class="lade">Moment …</div></div>

<dialog id="dlg"><div id="dlgInhalt"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/geko-auth.js"></script>
<script>
const FUNKTION = SUPABASE_URL + "/functions/v1/benutzer-verwalten";
let meineSitzung = null;

const sicher = (t) => String(t == null ? "" : t).replace(/[<>&"]/g,
  (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

// Jeder Aufruf trägt das Anmelde-Token des Admins. Ohne das lehnt die
// Function ab - deshalb steckt hier auch keine Berechtigungslogik.
async function ruf(nutzlast) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return { error: "abgemeldet" }; }
  const antwort = await fetch(FUNKTION, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + session.access_token,
    },
    body: JSON.stringify(nutzlast),
  });
  try { return await antwort.json(); } catch { return { error: "Unerwartete Antwort vom Server." }; }
}

// Passwortvorschlag: gut vorlesbar und abtippbar. Bewusst ohne 0/O und 1/l/I -
// die werden auf einem Zettel oder am Telefon regelmäßig verwechselt.
function passwortVorschlag() {
  const zeichen = "abcdefghjkmnpqrstuvwxyzACDEFGHJKLMNPQRSTUVWXYZ23456789";
  let aus = "";
  const zufall = crypto.getRandomValues(new Uint32Array(10));
  for (let i = 0; i < 10; i++) aus += zeichen[zufall[i] % zeichen.length];
  return aus;
}

function nameZuBenutzer(name) {
  return String(name || "").trim().toLowerCase()
    .replace(/[äÄ]/g, "ae").replace(/[öÖ]/g, "oe").replace(/[üÜ]/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9 ]/g, "").split(/\s+/).filter(Boolean)
    .map((teil, i) => i === 0 ? teil : teil.slice(0, 1)).join("");   // "Adnan Bekiri" -> "adnanb"
}

// ---- Liste zeichnen ------------------------------------------------------
async function laden() {
  const antwort = await ruf({ aktion: "liste" });
  if (antwort.error) {
    document.getElementById("inhalt").innerHTML =
      '<div class="karte"><b>Fehler:</b> ' + sicher(antwort.error) + '</div>';
    return;
  }
  const leute = antwort.mitarbeiter || [];
  const ohne = leute.filter(m => !m.hat_konto).length;

  document.getElementById("inhalt").innerHTML =
    '<div class="kopf"><div><h1>Zugänge</h1>'
    + '<div class="wer">Angemeldet als ' + sicher(meineSitzung.user.email) + '</div></div>'
    + '<button class="grau klein" id="raus">Abmelden</button></div>'
    + (ohne ? '<div class="karte hinweis">' + ohne + ' Mitarbeiter haben noch keinen Zugang. '
        + 'Erst wenn du einen anlegst, kann sich der Betreffende anmelden.</div>' : '')
    + leute.map(karte).join("")
    + (leute.length ? "" : '<div class="karte hinweis">Keine Mitarbeiter gefunden.</div>');

  document.getElementById("raus").onclick = async () => { await gekoAbmelden(); location.reload(); };
  leute.forEach(m => {
    const setz = (was, fn) => {
      const el = document.getElementById(was + "_" + m.id);
      if (el) el.onclick = () => fn(m);
    };
    setz("anlegen", dlgAnlegen);
    setz("pw", dlgPasswort);
    setz("sperren", (x) => umschalten(x, x.login_aktiv === false ? "entsperren" : "sperren"));
    setz("rolle", dlgRolle);
  });
}

function karte(m) {
  const marken =
    (m.rolle === "admin" ? '<span class="marke m-admin">Verwaltung</span>' : "")
    + (m.hat_konto && m.login_aktiv === false ? '<span class="marke m-gesperrt">gesperrt</span>' : "")
    + (m.hat_konto && m.pw_muss_wechsel ? '<span class="marke m-neu">Erstpasswort</span>' : "");

  const status = m.hat_konto
    ? "Benutzername: " + sicher(m.username || "—")
    : "Noch kein Zugang";

  const knoepfe = m.hat_konto
    ? '<button class="grau klein" id="pw_' + m.id + '">Passwort neu</button>'
      + '<button class="grau klein" id="rolle_' + m.id + '">Rolle</button>'
      + '<button class="' + (m.login_aktiv === false ? "grau" : "rot") + ' klein" id="sperren_' + m.id + '">'
      + (m.login_aktiv === false ? "Entsperren" : "Sperren") + '</button>'
    : '<button class="klein" id="anlegen_' + m.id + '">Zugang anlegen</button>';

  return '<div class="karte"><div class="zeile"><div>'
    + '<div class="name">' + sicher(m.name || m.id) + marken + '</div>'
    + '<div class="status">' + status + '</div></div></div>'
    + '<div class="werkzeuge">' + knoepfe + '</div></div>';
}

// ---- Dialoge -------------------------------------------------------------
const dlg = document.getElementById("dlg");
function zeigeDialog(html) {
  document.getElementById("dlgInhalt").innerHTML = html;
  dlg.showModal();
}
const schliessen = () => dlg.close();

function dlgAnlegen(m) {
  const vorschlag = nameZuBenutzer(m.name) || m.id;
  const pw = passwortVorschlag();
  zeigeDialog(
    '<h2 style="margin:0 0 4px;font-size:18px">Zugang für ' + sicher(m.name) + '</h2>'
    + '<p class="hinweis" style="margin:0">Beim ersten Anmelden muss er sich selbst ein '
    + 'Passwort setzen. Danach kann es niemand mehr einsehen — auch du nicht.</p>'
    + '<label>Benutzername</label>'
    + '<input id="dU" value="' + sicher(vorschlag) + '" autocapitalize="none" spellcheck="false">'
    + '<label>Erstes Passwort</label>'
    + '<input id="dP" value="' + sicher(pw) + '">'
    + '<label>Rolle</label>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="klein" id="rMa" style="flex:1">Mitarbeiter</button>'
    + '<button class="grau klein" id="rAd" style="flex:1">Verwaltung</button></div>'
    + '<div id="dFehler" class="hinweis" style="color:#a3282c;margin-top:10px"></div>'
    + '<div style="display:flex;gap:8px;margin-top:16px">'
    + '<button class="grau" id="dAb" style="flex:1">Abbrechen</button>'
    + '<button id="dOk" style="flex:2">Anlegen</button></div>');

  let rolle = "mitarbeiter";
  const rMa = document.getElementById("rMa"), rAd = document.getElementById("rAd");
  const malen = () => {
    rMa.className = rolle === "mitarbeiter" ? "klein" : "grau klein";
    rAd.className = rolle === "admin" ? "klein" : "grau klein";
  };
  rMa.onclick = () => { rolle = "mitarbeiter"; malen(); };
  rAd.onclick = () => { rolle = "admin"; malen(); };

  document.getElementById("dAb").onclick = schliessen;
  document.getElementById("dOk").onclick = async () => {
    const knopf = document.getElementById("dOk");
    const benutzername = document.getElementById("dU").value.trim();
    const passwort = document.getElementById("dP").value;
    knopf.disabled = true; knopf.textContent = "Moment …";
    const erg = await ruf({ aktion: "anlegen", mitarbeiter_id: m.id, benutzername, passwort, rolle });
    if (erg.error) {
      document.getElementById("dFehler").textContent = erg.error;
      knopf.disabled = false; knopf.textContent = "Anlegen";
      return;
    }
    zettel(m.name, erg.benutzername, passwort);
  };
}

// Der Zettel zum Weitergeben. Einziger Moment, in dem das Passwort sichtbar
// ist - danach kennt es nur noch der Mitarbeiter.
function zettel(name, benutzername, passwort) {
  zeigeDialog(
    '<h2 style="margin:0 0 4px;font-size:18px">Zugang steht</h2>'
    + '<p class="hinweis" style="margin:0">Gib ' + sicher(name) + ' diese Daten. '
    + '<strong>Das Passwort siehst du jetzt zum letzten Mal</strong> — beim ersten Anmelden '
    + 'setzt er sich sein eigenes.</p>'
    + '<div class="zettel">Benutzername: <code>' + sicher(benutzername) + '</code><br>'
    + 'Passwort: <code>' + sicher(passwort) + '</code></div>'
    + '<button id="dKopie" class="grau" style="width:100%;margin-top:12px">Zum Kopieren</button>'
    + '<button id="dFertig" style="width:100%;margin-top:8px">Fertig</button>');

  document.getElementById("dKopie").onclick = () => {
    navigator.clipboard.writeText("Benutzername: " + benutzername + "\nPasswort: " + passwort)
      .then(() => { document.getElementById("dKopie").textContent = "Kopiert ✓"; })
      .catch(() => { document.getElementById("dKopie").textContent = "Ging nicht — bitte abschreiben"; });
  };
  document.getElementById("dFertig").onclick = () => { schliessen(); laden(); };
}

function dlgPasswort(m) {
  const pw = passwortVorschlag();
  zeigeDialog(
    '<h2 style="margin:0 0 4px;font-size:18px">Neues Passwort für ' + sicher(m.name) + '</h2>'
    + '<p class="hinweis" style="margin:0">Für den Fall, dass er sein Passwort vergessen hat. '
    + 'Das alte gilt danach nicht mehr.</p>'
    + '<label>Neues Passwort</label><input id="dP" value="' + sicher(pw) + '">'
    + '<div id="dFehler" class="hinweis" style="color:#a3282c;margin-top:10px"></div>'
    + '<div style="display:flex;gap:8px;margin-top:16px">'
    + '<button class="grau" id="dAb" style="flex:1">Abbrechen</button>'
    + '<button id="dOk" style="flex:2">Setzen</button></div>');

  document.getElementById("dAb").onclick = schliessen;
  document.getElementById("dOk").onclick = async () => {
    const knopf = document.getElementById("dOk");
    const passwort = document.getElementById("dP").value;
    knopf.disabled = true; knopf.textContent = "Moment …";
    const erg = await ruf({ aktion: "passwort_neu", mitarbeiter_id: m.id, passwort });
    if (erg.error) {
      document.getElementById("dFehler").textContent = erg.error;
      knopf.disabled = false; knopf.textContent = "Setzen";
      return;
    }
    zettel(m.name, m.username, passwort);
  };
}

function dlgRolle(m) {
  const neu = m.rolle === "admin" ? "mitarbeiter" : "admin";
  zeigeDialog(
    '<h2 style="margin:0 0 4px;font-size:18px">Rolle ändern</h2>'
    + '<p class="hinweis" style="margin:0">' + sicher(m.name) + ' ist derzeit <strong>'
    + (m.rolle === "admin" ? "Verwaltung" : "Mitarbeiter") + '</strong>. '
    + (neu === "admin"
        ? "Als Verwaltung sieht er ALLE Daten und kann Zugänge vergeben."
        : "Als Mitarbeiter sieht er nur noch seine eigenen Daten.") + '</p>'
    + '<div id="dFehler" class="hinweis" style="color:#a3282c;margin-top:10px"></div>'
    + '<div style="display:flex;gap:8px;margin-top:16px">'
    + '<button class="grau" id="dAb" style="flex:1">Abbrechen</button>'
    + '<button id="dOk" style="flex:2">Zu ' + (neu === "admin" ? "Verwaltung" : "Mitarbeiter") + '</button></div>');

  document.getElementById("dAb").onclick = schliessen;
  document.getElementById("dOk").onclick = async () => {
    const erg = await ruf({ aktion: "rolle_setzen", mitarbeiter_id: m.id, rolle: neu });
    if (erg.error) { document.getElementById("dFehler").textContent = erg.error; return; }
    schliessen(); laden();
  };
}

async function umschalten(m, aktion) {
  const sperren = aktion === "sperren";
  if (sperren && !confirm(m.name + " kann sich danach nicht mehr anmelden.\n\n"
      + "Alle Daten (Touren, Unterschriften, Urlaub) bleiben erhalten.")) return;
  const erg = await ruf({ aktion, mitarbeiter_id: m.id });
  if (erg.error) { alert(erg.error); return; }
  laden();
}

// ---- Start ---------------------------------------------------------------
gekoSchuetze({
  nurAdmin: true,
  titel: "GEKO · Zugänge",
  weiter: (sitzung) => { meineSitzung = sitzung; laden(); },
});
</script>
</body>
</html>
