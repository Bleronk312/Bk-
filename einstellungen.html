<style>
  /* Kleinkram, der nicht in style.css steht - bewusst auf den Tokens von
     style.css aufgebaut, damit Hell/Dunkel automatisch stimmen. */
  .est-wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
  .est-sec-title { font-size: 13px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-secondary); margin: 22px 4px 8px; }
  .est-zeile { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .est-zeile:first-child { border-top: 0; }
  .est-name { font-weight: 600; font-size: 15px; min-width: 0; }
  .est-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .est-marke { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
    border-radius: 20px; vertical-align: 1px; margin-left: 6px; }
  .m-admin { background: rgba(31,93,146,.14); color: #1f5d92; }
  .dark .m-admin { color: #7db4e0; }
  .m-rot { background: rgba(209,52,56,.12); color: #c22e32; }
  .m-gelb { background: rgba(224,179,87,.18); color: #8a5a00; }
  .dark .m-gelb { color: #e0b357; }
  .est-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .est-btns .btn { padding: 8px 11px; font-size: 13px; }
  dialog.est-dlg { border: 0; border-radius: 15px; padding: 20px; max-width: 400px;
    width: 92%; background: var(--card-bg, #fff); color: var(--text, #1c2530);
    box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  dialog.est-dlg::backdrop { background: rgba(15,23,32,.55); }
  /* Dialog federt kurz herein statt hart aufzupoppen - nur transform/opacity */
  dialog.est-dlg[open] { animation: estPop .2s cubic-bezier(.32,.72,0,1); }
  @keyframes estPop { from { transform: scale(.95) translateY(8px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { dialog.est-dlg[open] { animation: none; } }
  .est-zettel { background: rgba(224,179,87,.12); border: 1px dashed #cfa14f;
    border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 15px; line-height: 1.7; }
  .est-zettel code { font-weight: 800; font-size: 15px; }
</style>

<body class="glas-logo-left">

  <div id="gekoAuthOverlay" style="position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px;">Anmeldung wird gepr&uuml;ft &hellip;</div>
  <script>
  // Schnellstart gegen das Aufblitzen - echte Pruefung folgt unten sofort.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("geko_auth") || "null");
      var p = JSON.parse(localStorage.getItem("geko_profil") || "null");
      var u = s && (s.user || (s.currentSession && s.currentSession.user));
      if (u && p && p.uid === u.id && p.rolle === "admin") {
        document.getElementById("gekoAuthOverlay").style.display = "none";
      }
    } catch (e) {}
  })();
  </script>

  <div class="app-header">
    <div class="brand-row geko-navrow">
      <a href="hub.html" class="geko-hubbtn" title="Zur Startseite"><span class="hb-ic">⌂</span>Hub</a>
      <span class="geko-brand"><span class="dot"></span>Einstellungen</span>
    </div>
  </div>

  <div class="est-wrap" id="inhalt"><p class="muted" style="padding:20px 4px;">Lade …</p></div>

  <dialog class="est-dlg" id="dlg"><div id="dlgInhalt"></div></dialog>
  <div id="toast" class="toast"></div>

  <script src="vendor/lib/supabase-js@2.min.js"></script>
  <script defer src="vendor/lib/jspdf.umd.min.js"></script>
  <script src="js/config.js?v=222"></script>
  <script src="js/supabase-client.js?v=222"></script>
  <script src="js/geko-auth.js?v=222"></script>
  <script src="js/pdf-ansicht.js?v=222"></script>
  <script src="js/push.js?v=222"></script>
  <script defer src="js/pdf-fonts.js?v=222"></script>
  <script defer src="js/glas-lager-pdf.js?v=222"></script>
  <script>
  // ==========================================================================
  // GEKO · Zentrale Einstellungen (nur Verwaltung)
  //  1. Mein Konto        - eigenes Passwort aendern
  //  2. Zugaenge          - Mitarbeiter-Konten + reine Verwaltungskonten
  //  3. Benachrichtigungen- dieses Geraet anmelden + Themen-Schalter
  //  4. Darstellung       - Hell/Dunkel fuer dieses Geraet
  // ==========================================================================
  const FUNKTION = SUPABASE_URL + "/functions/v1/benutzer-verwalten";
  let meineSitzung = null;
  let zugangsdaten = null;      // Antwort der "liste"-Aktion
  let pushEinstellungen = {};   // Zeile aus glas_einstellungen
  let mitarbeiter = [];         // glas_mitarbeiter (Stammdaten)
  let urlaube = [];             // glas_urlaub (nur fuer die Resttage-Bilanz)
  let offenerMa = null;         // aufgeklappte Mitarbeiter-Karte
  let bearbeiten = null;        // Mitarbeiter im Formular (null = Liste)
  let detailMa = null;          // geoeffnete Mitarbeiter-Seite (id) oder null
  let pdfMonat = "";            // Monatsauswahl fuer den Einsatzplan
  let meinEndpoint = null;      // Push-Anmeldung dieses Geraets
  let meineAbos = [];           // welche Kanaele dieses Geraet empfaengt
  let binOberAdmin = false;     // nur der darf Zugaenge verwalten

  function showToast(text) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = text; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  const sicher = (t) => String(t == null ? "" : t).replace(/[<>&"']/g,
    (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c]));

  // Text fuer ein onclick="..." - siehe gekoJsText in js/app-shared.js.
  // escapeHtml/sicher reichen dort NICHT: der Browser loest &#39; im Attribut
  // wieder zu einem echten Anfuehrungszeichen auf, BEVOR er das JavaScript
  // uebersetzt. Ein Name mit ' koennte damit aus der Zeichenkette ausbrechen.
  // Deshalb wird hier alles ausser Buchstaben, Ziffern und Leerzeichen als
  // \uXXXX geschrieben.
  const jsText = (t) => String(t == null ? "" : t).replace(/[^A-Za-z0-9 ]/g,
    (z) => "\\u" + z.charCodeAt(0).toString(16).padStart(4, "0"));

  async function ruf(nutzlast, zweiterVersuch) {
    // gekoToken() erneuert das Token vorher, wenn es gleich ablaeuft.
    const token = await gekoToken();
    if (!token) return { error: "Anmeldung abgelaufen – bitte Seite neu laden." };
    try {
      const antwort = await fetch(FUNKTION, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY,
                   "Authorization": "Bearer " + token },
        body: JSON.stringify(nutzlast),
      });
      // 401/403 kann auch ein Token sein, das genau zwischen Pruefung und
      // Ankunft abgelaufen ist. Einmal erneuern und wiederholen, bevor eine
      // Fehlermeldung erscheint, die den Nutzer nur ratlos macht.
      if ((antwort.status === 401 || antwort.status === 403) && !zweiterVersuch) {
        try { await sb.auth.refreshSession(); } catch (e) {}
        return await ruf(nutzlast, true);
      }
      return await antwort.json();
    } catch (e) { return { error: "Keine Verbindung." }; }
  }

  function passwortVorschlag() {
    // Ohne 0/O und 1/l/I - wird vom Zettel abgetippt.
    const zeichen = "abcdefghjkmnpqrstuvwxyzACDEFGHJKLMNPQRSTUVWXYZ23456789";
    const zufall = crypto.getRandomValues(new Uint32Array(10));
    let aus = "";
    for (let i = 0; i < 10; i++) aus += zeichen[zufall[i] % zeichen.length];
    return aus;
  }

  // ---- Laden -------------------------------------------------------------
  // Bewusst mit Auffangnetz: Geht beim Laden etwas schief, muss eine Meldung
  // erscheinen. Vorher blieb in so einem Fall einfach "Lade …" stehen, und man
  // hatte keinen Anhaltspunkt, was los ist.
  async function allesLaden() {
    try {
      await allesLadenIntern();
    } catch (e) {
      document.getElementById("inhalt").innerHTML =
        '<div class="card" style="margin-top:16px;"><b>Die Einstellungen konnten nicht geladen werden.</b>'
        + '<p class="est-sub" style="margin:6px 0 12px;">' + sicher((e && e.message) || e) + '</p>'
        + '<button class="btn btn-primary" onclick="location.reload()">Neu laden</button></div>';
    }
  }

  async function allesLadenIntern() {
    const [liste, einst, ma, url, lager] = await Promise.all([
      ruf({ aktion: "liste" }),
      sb.from("glas_einstellungen").select("*").eq("id", "default").maybeSingle(),
      sb.from("glas_mitarbeiter").select("*").order("name"),
      sb.from("glas_urlaub").select("id, mitarbeiter_id, von, bis, notiz, status"),
      // Fuer den Einsatzplan als PDF - dieselbe Quelle wie in der Glas-App
      sb.from("glas_lager_plan").select("*").order("datum"),
    ]);
    zugangsdaten = liste;
    binOberAdmin = !!(liste && liste.ich_bin_oberadmin);
    pushEinstellungen = (einst && einst.data) || {};
    mitarbeiter = (ma && ma.data) || [];
    urlaube = (url && url.data) || [];
    // glas-lager-pdf.js liest diese drei Namen direkt aus dem globalen Bereich
    // (es stammt aus der Glas-App). Statt die Datei umzubauen, stellen wir sie
    // hier bereit - so bleibt das PDF an EINER Stelle gepflegt.
    window.glasLagerPlan = (lager && lager.data) || [];
    window.glasUrlaub = urlaube;
    window.glasMitarbeiter = mitarbeiter;
    window.glasMaName = (id) => {
      const m = mitarbeiter.find((x) => x.id === id);
      return m ? m.name : id;
    };
    await meineAbosLaden();
    render();
  }

  // ---- Urlaubs-Bilanz (gleiche Rechnung wie in der Glas-App) --------------
  // Nur guelltiger Urlaub zaehlt: offene Antraege sind nicht entschieden,
  // abgelehnte gelten nicht. Ohne Status = alter Eintrag = guelltig.
  function urlaubBilanz(m) {
    const jahr = new Date().getFullYear();
    const meine = urlaube.filter((u) => u.mitarbeiter_id === m.id && (!u.status || u.status === "genehmigt"));
    let moFr = 0, moSa = 0;
    meine.forEach((r) => {
      let d = new Date(r.von + "T00:00:00");
      const end = new Date((r.bis || r.von) + "T00:00:00");
      let schutz = 0;
      while (d <= end && schutz++ < 800) {
        if (d.getFullYear() === jahr) {
          const wd = d.getDay();               // 0 = Sonntag
          if (wd !== 0) moSa++;
          if (wd !== 0 && wd !== 6) moFr++;
        }
        d.setDate(d.getDate() + 1);
      }
    });
    const genommen = m.arbeitstage === "mo_sa" ? moSa : moFr;
    const anspruch = m.urlaubsanspruch != null ? m.urlaubsanspruch : 30;
    return { anspruch, genommen, uebrig: anspruch - genommen };
  }

  // ---- Zeichnen ----------------------------------------------------------
  function render() {
    const el = document.getElementById("inhalt");
    el.innerHTML = bearbeiten ? renderMaFormular()
      : detailMa ? renderMaDetail()
      : renderMitarbeiter() + renderMeinKonto() + renderVerwaltungsKonten()
        + renderPush() + renderErinnerungen() + renderDarstellung();
  }

  function renderMeinKonto() {
    const mail = meineSitzung?.user?.email || "?";
    return `
      <p class="est-sec-title">Mein Konto</p>
      <div class="card">
        <p style="margin:0; font-weight:600;">${sicher(mail)} <span class="est-marke m-admin">Verwaltung</span></p>
        <p class="muted" style="margin:4px 0 12px; font-size:12.5px;">Auf diesem Gerät angemeldet. Abmelden gilt für alle GEKO-Seiten.</p>
        <div class="est-btns">
          <button class="btn btn-primary" onclick="dlgEigenesPasswort()">🔑 Passwort ändern</button>
          <button class="btn" onclick="abmelden()">Abmelden</button>
        </div>
      </div>`;
  }

  // ==== Mitarbeiter: Stammdaten, Bausteine, Urlaubsanspruch, Zugang ========
  // Alles an EINEM Ort - vorher lagen Zugaenge hier und die Stammdaten in der
  // Glas-Verwaltung, was beim Pflegen staendig zum Hin- und Herspringen zwang.
  function renderMitarbeiter() {
    const konten = new Map(((zugangsdaten && zugangsdaten.mitarbeiter) || []).map((k) => [k.id, k]));
    const liste = [...mitarbeiter].sort((a, b) => {
      const rang = (x) => (!x.username ? 2 : x.login_aktiv === false ? 1 : 0);
      return rang(a) - rang(b) || (a.name || "").localeCompare(b.name || "", "de");
    });

    const karte = (m) => {
      const k = konten.get(m.id) || {};
      const b = urlaubBilanz(m);
      const restFarbe = b.uebrig < 0 ? "var(--danger)" : b.uebrig <= 3 ? "#d08a1f" : "#2e9e4f";
      const status = !k.hat_konto
        ? '<span class="est-marke m-gelb">kein Zugang</span>'
        : (k.login_aktiv === false ? '<span class="est-marke m-rot">gesperrt</span>' : "")
          + (k.rolle === "admin" ? '<span class="est-marke m-admin">Verwaltung</span>' : "")
          + (k.pw_muss_wechsel ? '<span class="est-marke m-gelb">Einmal-Passwort</span>' : "");

      return `
        <div class="est-zeile" style="cursor:pointer;" onclick="maDetailOeffnen('${m.id}')">
          <div style="flex:1; min-width:0;">
            <div class="est-name">${sicher(m.name || m.id)}${status}</div>
            <div class="est-sub">${m.arbeitstage === "mo_sa" ? "Mo–Sa" : "Mo–Fr"}
              · <b style="color:${restFarbe};">${b.uebrig} Urlaubstage übrig</b>
              ${k.username ? " · " + sicher(k.username) : ""}</div>
          </div>
          <span style="color:var(--text-secondary); font-size:18px;">›</span>
        </div>`;
    };

    const fehler = zugangsdaten && zugangsdaten.error
      ? `<p class="muted" style="margin:0 0 8px; color:var(--danger);">Zugänge konnten nicht geladen werden: ${sicher(zugangsdaten.error)}</p>` : "";

    return `
      <p class="est-sec-title">Mitarbeiter</p>
      <div class="card">
        ${fehler}
        ${liste.length ? liste.map(karte).join("") : '<p class="muted" style="margin:0;">Noch keine Mitarbeiter angelegt.</p>'}
        <button class="btn btn-primary" style="margin-top:12px;" onclick="maNeu()">+ Neuer Mitarbeiter</button>
        ${binOberAdmin ? "" : '<p class="muted" style="margin:8px 0 0; font-size:12px;">Stammdaten und Bausteine kannst du pflegen. Zugänge und Passwörter verwaltet der Ober-Admin.</p>'}
        <p class="muted" style="margin:8px 0 0; font-size:12px;">Urlaub eintragen und Anträge genehmigen läuft weiter im Kalender der Glas-Verwaltung – dort steht der Monatsüberblick, wer wann weg ist.</p>
      </div>`;
  }

  // Arbeitstage eines Eintrags zaehlen - je nach 5- oder 6-Tage-Woche, genau
  // wie die Jahresbilanz. Sonntage zaehlen nie.
  function urlaubTage(m, u) {
    const sa = m.arbeitstage === "mo_sa";
    let tage = 0;
    let d = new Date(u.von + "T00:00:00");
    const bis = new Date((u.bis || u.von) + "T00:00:00");
    let schutz = 0;
    while (d <= bis && schutz++ < 800) {
      const wt = d.getDay();                 // 0 = Sonntag
      if (wt !== 0 && (sa || wt !== 6)) tage++;
      d.setDate(d.getDate() + 1);
    }
    return tage;
  }

  function datumKurz(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`;
  }

  // Wann wurde wie viel genommen? Die reine Restzahl beantwortet die Frage
  // nicht, die im Buero tatsaechlich gestellt wird ("wann war der weg?").
  function renderUrlaubUebersicht(m, b) {
    const jahr = new Date().getFullYear();
    const meine = urlaube
      .filter((u) => u.mitarbeiter_id === m.id && u.von && u.von.slice(0, 4) === String(jahr))
      .sort((a, b2) => a.von.localeCompare(b2.von));

    const farbe = b.uebrig < 0 ? "var(--danger)" : b.uebrig <= 3 ? "#d08a1f" : "#2e9e4f";
    const kopf = `
      <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 8px;">
        <span style="font-weight:700; font-size:14px;">Urlaub ${jahr}</span>
        <span class="est-sub" style="margin:0;">${b.genommen} von ${b.anspruch} genommen ·
          <b style="color:${farbe};">${b.uebrig} übrig</b></span>
      </div>`;

    if (!meine.length) {
      return kopf + `<p class="est-sub" style="margin:0 0 10px;">Noch kein Urlaub in ${jahr}.</p>`;
    }

    const zeilen = meine.map((u) => {
      const tage = urlaubTage(m, u);
      const st = u.status || "genehmigt";
      const marke = st === "offen"
        ? '<span class="est-marke m-gelb">beantragt</span>'
        : st === "abgelehnt" ? '<span class="est-marke m-rot">abgelehnt</span>' : "";
      // Abgelehnte Antraege zaehlen nicht gegen den Anspruch - dann darf ihre
      // Tageszahl hier auch nicht so aussehen, als waere sie verbraucht.
      const zaehlt = st !== "abgelehnt" && st !== "offen";
      const spanne = (u.bis && u.bis !== u.von)
        ? `${datumKurz(u.von)} – ${datumKurz(u.bis)}` : datumKurz(u.von);
      return `<div style="display:flex; align-items:baseline; gap:8px; padding:5px 0; border-top:1px solid var(--border); font-size:13.5px;">
        <span style="flex:1; min-width:0;">${spanne}${marke}
          ${u.notiz ? `<span class="est-sub" style="display:block;">${sicher(u.notiz)}</span>` : ""}</span>
        <span style="font-weight:700; ${zaehlt ? "" : "opacity:.5;"}">${tage} Tag${tage === 1 ? "" : "e"}</span>
      </div>`;
    }).join("");

    return kopf + zeilen + '<div style="height:10px;"></div>';
  }

  // ==== Mitarbeiter-Seite ==================================================
  // Eine eigene Seite statt eines Aufklappers: Urlaub, Einsatzplan und Zugang
  // gehoeren zusammen und brauchen Platz - im Aufklapper war das gequetscht.
  function maDetailOeffnen(id) {
    detailMa = id; pdfMonat = "";
    render(); window.scrollTo(0, 0);
    // Dokumente darf die ganze Verwaltung - diese Seite ist ohnehin nur fuer
    // Admins erreichbar. Passwoerter, Konten und Sperren bleiben davon
    // unberuehrt beim Ober-Admin.
    lohnListeLaden(id);
  }
  function maDetailSchliessen() { detailMa = null; render(); }

  function renderMaDetail() {
    const m = mitarbeiter.find((x) => x.id === detailMa);
    if (!m) { detailMa = null; return renderMitarbeiter(); }
    const k = ((zugangsdaten && zugangsdaten.mitarbeiter) || []).find((x) => x.id === m.id) || {};
    const b = urlaubBilanz(m);

    const bereiche = [
      m.zugang_glas !== false ? "🧽 Glas" : null,
      m.zugang_graffiti === true ? "🎨 Graffiti" : null,
      m.zugang_checkin === true ? "📍 Check-ins" : null,
      m.zugang_lager === true ? "📦 Lager" : null,
    ].filter(Boolean).join(" · ") || "<i>keine Bereiche</i>";

    // Letzte 12 Monate zur Auswahl - weiter zurueck braucht im Buero niemand.
    const monate = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      monate.push({ wert: `${d.getFullYear()}-${d.getMonth()}`,
                    text: `${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]} ${d.getFullYear()}` });
    }
    if (!pdfMonat) pdfMonat = monate[0].wert;

    const zugangKarte = k.hat_konto ? `
      <p style="margin:0 0 2px;"><b>${sicher(k.username || "—")}</b>
        ${k.rolle === "admin" ? '<span class="est-marke m-admin">Verwaltung</span>' : ""}
        ${k.login_aktiv === false ? '<span class="est-marke m-rot">gesperrt</span>' : ""}
        ${k.pw_muss_wechsel ? '<span class="est-marke m-gelb">Einmal-Passwort aktiv</span>' : ""}</p>
      <p class="est-sub" style="margin:0 0 12px;">Das Passwort setzt sich ${sicher(m.name)} beim ersten Anmelden selbst – es ist für niemanden einsehbar.</p>
      ${binOberAdmin ? `<div class="est-btns">
        <button class="btn" onclick="aktionPasswort('${m.id}', null, '${jsText(m.name)}')">🔄 Einmal-Passwort</button>
        <button class="btn" onclick="aktionRolle('${m.id}', '${k.rolle}', '${jsText(m.name)}')">Rolle ändern</button>
        <button class="btn" ${k.login_aktiv === false ? "" : 'style="color:var(--danger);"'} onclick="aktionSperre('${m.id}', null, ${k.login_aktiv === false}, '${jsText(m.name)}')">${k.login_aktiv === false ? "🔓 Entsperren" : "🔒 Sperren"}</button>
      </div>` : '<p class="est-sub" style="margin:0;">Passwörter und Sperren verwaltet der Ober-Admin.</p>'}`

  // ==== Lohnabrechnungen (privater Datei-Speicher, Regeln in
  //      supabase_add_lohn.sql: Ober-Admin alles, Mitarbeiter nur eigene) ====
  const LOHN_MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  // Die Überschrift steckt kodiert im Dateinamen (base64url) - so braucht es
  // keine eigene Tabelle, und die Überschriften sind vom selben Speicher-
  // Schutz gedeckt wie die PDFs selbst. Umlaute überleben die Kodierung.
  function dokKode(titel) {
    return "b64-" + btoa(unescape(encodeURIComponent(titel)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function lohnLabel(name) {
    const roh = String(name || "");
    const b = roh.match(/^\d+__b64-([A-Za-z0-9_-]+)\.pdf$/);
    if (b) {
      try {
        const b64 = b[1].replace(/-/g, "+").replace(/_/g, "/");
        return decodeURIComponent(escape(atob(b64 + "===".slice((b64.length + 3) % 4))));
      } catch (e) { /* dann eben roh anzeigen */ }
    }
    // Altbestand aus der ersten Fassung: JJJJ-MM.pdf als Monat anzeigen
    const m = roh.match(/^(\d{4})-(\d{2})\.pdf$/);
    if (m) return `Lohnabrechnung ${LOHN_MON[parseInt(m[2], 10) - 1] || m[2]} ${m[1]}`;
    return roh.replace(/\.pdf$/, "");
  }

  function dokWaehlen() {
    const titel = (document.getElementById("dokTitel").value || "").trim();
    if (!titel) { showToast("Bitte zuerst eine Überschrift eintragen"); return; }
    document.getElementById("lohnDatei").click();
  }

  async function lohnListeLaden(maId) {
    const ziel = document.getElementById("lohnListe");
    if (!ziel) return;
    const { data, error } = await sb.storage.from("lohn")
      .list(maId, { limit: 100, sortBy: { column: "name", order: "desc" } });
    if (!document.getElementById("lohnListe")) return;   // Seite inzwischen gewechselt
    if (error) {
      ziel.innerHTML = `<p class="est-sub" style="margin:0; color:var(--danger);">${
        /bucket/i.test(error.message || "") ? "Bitte supabase_add_lohn.sql ausführen." : sicher(error.message)}</p>`;
      return;
    }
    const dateien = (data || []).filter((f) => f.name.endsWith(".pdf"));
    ziel.innerHTML = dateien.length ? dateien.map((f) => `
      <div class="est-zeile">
        <div style="flex:1; min-width:0;">
          <div class="est-name">📄 ${sicher(lohnLabel(f.name))}</div>
        </div>
        <div class="est-btns">
          <button class="btn" onclick="lohnOeffnen('${maId}', '${jsText(f.name)}')">Ansehen</button>
          <button class="btn" style="color:var(--danger);" onclick="lohnLoeschen('${maId}', '${jsText(f.name)}')">Löschen</button>
        </div>
      </div>`).join("")
      : '<p class="est-sub" style="margin:0;">Noch keine Dokumente hochgeladen.</p>';
  }

  async function lohnHochladen(maId) {
    const eingabe = document.getElementById("lohnDatei");
    const datei = eingabe && eingabe.files && eingabe.files[0];
    if (!datei) return;
    if (datei.type !== "application/pdf") { showToast("Bitte eine PDF-Datei wählen"); return; }
    const titel = (document.getElementById("dokTitel").value || "").trim();
    if (!titel) { showToast("Bitte zuerst eine Überschrift eintragen"); eingabe.value = ""; return; }
    const knopf = document.getElementById("lohnKnopf");
    if (knopf) { knopf.disabled = true; knopf.textContent = "Lade hoch …"; }

    const { error } = await sb.storage.from("lohn")
      .upload(`${maId}/${Date.now()}__${dokKode(titel)}.pdf`, datei, { contentType: "application/pdf" });
    if (knopf) { knopf.disabled = false; knopf.textContent = "📄 PDF wählen & hochladen"; }
    eingabe.value = "";
    if (error) { showToast("Hochladen fehlgeschlagen: " + error.message); return; }

    showToast("Hochgeladen ✓");
    document.getElementById("dokTitel").value = "";
    lohnListeLaden(maId);
    // Die Überschrift IST die Mitteilung - gezielt nur an seine Geräte.
    try {
      sb.functions.invoke("send-push", { body: {
        role: "geko_one", mitarbeiter_id: maId,
        title: "📄 " + titel,
        body: "Liegt in GEKO One unter Dokumente für dich bereit.",
        url: "/meine.html",
      } }).catch(() => {});
    } catch (e) {}
  }

  async function lohnOeffnen(maId, name) {
    const { data, error } = await sb.storage.from("lohn").createSignedUrl(`${maId}/${name}`, 300);
    if (error || !data) { showToast("Konnte die Datei nicht öffnen"); return; }
    if (typeof gekoPdfZeigen === "function") gekoPdfZeigen(data.signedUrl, lohnLabel(name));
    else window.open(data.signedUrl, "_blank");
  }

  async function lohnLoeschen(maId, name) {
    if (!confirm(`${lohnLabel(name)} löschen?`)) return;
    const { error } = await sb.storage.from("lohn").remove([`${maId}/${name}`]);
    if (error) { showToast("Löschen fehlgeschlagen: " + error.message); return; }
    showToast("Gelöscht");
    lohnListeLaden(maId);
  }

  async function einsatzplanPdf(maId) {
    if (typeof glasLagerPdfErstellen !== "function" || !(window.jspdf && window.jspdf.jsPDF)) {
      showToast("PDF-Bibliothek lädt noch – kurz warten"); return;
    }
    const teile = String(pdfMonat || "").split("-");
    const monat = teile.length === 2
      ? { year: parseInt(teile[0], 10), month: parseInt(teile[1], 10) }
      : { year: new Date().getFullYear(), month: new Date().getMonth() };
    try {
      glasLagerPdfErstellen(monat, maId);
      showToast("📄 Einsatzplan erstellt");
    } catch (e) {
      showToast("PDF-Fehler: " + ((e && e.message) || e));
    }
  }

  // ==== Reine Verwaltungskonten (ohne Mitarbeiter-Eintrag) =================
  function renderVerwaltungsKonten() {
    const freie = (zugangsdaten && zugangsdaten.admins_ohne_mitarbeiter) || [];
    const zeile = (a) => `
      <div class="est-zeile"><div style="flex:1; min-width:150px;">

        <div class="est-sub" style="margin-top:2px;">${

    const maAdmins = ((zugangsdaten && zugangsdaten.mitarbeiter) || [])

          : `<p class="muted" style="margin:8px 0 0; font-size:12px;">Zugänge anlegen, Passwörter zurücksetzen und sperren darf nur der Ober-Admin. Grund: Wer ein Passwort zurücksetzen kann, kann sich anschließend als der Betreffende anmelden.</p>`}
      </div>`;
  }

  // ==== Anmeldestand ========================================================
  // Steht NICHT als eigener Block auf der Startseite, sondern dort, wo die
  // Person ohnehin schon steht: im Profil des Mitarbeiters bzw. in der Zeile
  // des Verwaltungs-Zugangs. Alles zu einem Menschen an einem Ort.
  //
  // Zweck ist nicht zu sehen, wer wie lange am Handy hängt - dafür ist das viel
  // zu grob. Zweck ist, dass ein Konto AUFFÄLLT, das sich rührt, obwohl es das
  // nicht sollte: der gekündigte Kollege, das verlorene Handy, ein Zugang, den
  // jemand weitergegeben hat.
  function zeitHer(iso) {
    if (!iso) return null;
    const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 0) return "gerade eben";
    if (min < 60) return min <= 1 ? "gerade eben" : `vor ${min} Min.`;
    const std = Math.floor(min / 60);
    if (std < 24) return `vor ${std} Std.`;
    const tage = Math.floor(std / 24);
    if (tage === 1) return "gestern";
    if (tage < 30) return `vor ${tage} Tagen`;
    return new Date(iso).toLocaleDateString("de-DE");
  }

  // Anmeldestand einer Person - als Baustein, damit ihn sowohl das
  // Mitarbeiter-Profil als auch die Verwaltungs-Zugaenge verwenden koennen.
  //   aktiv    = Zeitpunkt (ISO) oder null
  //   geraete  = Liste von Namen, z.B. ["iPhone · App"]
  //   anzahl   = Anzahl Geraete (auch wenn die Namen noch fehlen)
  // "Aktiv" heisst: in den letzten 15 Minuten in der App gewesen. Genauer geht
  // es ohne Dauerverbindung nicht, und die waere den Akku nicht wert.
  const AKTIV_FENSTER = 15 * 60 * 1000;

  // Reine Anzeige. Bewusst OHNE Knopf zum Abmelden: Eine einzelne Anmeldung
  // gezielt zu beenden, geht mit Supabase nicht - der Server fuehrt keine Liste,
  // welches Handy welche Anmeldung hat. Ein Knopf, der so aussieht, als koenne
  // er das, waere schlimmer als keiner. Wer jemanden aussperren muss, nimmt
  // "Sperren" (wirkt sofort und serverseitig) oder ein neues Einmal-Passwort.
  function renderAnmeldestand(aktiv, liste) {
    const frisch = aktiv && (Date.now() - new Date(aktiv).getTime()) < AKTIV_FENSTER;
    const punkt = frisch ? "#12a150" : "#c9ced6";
    const geraete = liste || [];

    const zeilen = geraete.length
      ? geraete.map((g) => `
          <div style="padding:7px 0; border-top:1px solid var(--border);">
            📱 ${g.name ? sicher(g.name) : "<i>wird beim nächsten Öffnen der App ergänzt</i>"}
          </div>`).join("")
      : "";

    return `
      <div style="display:flex; gap:10px; align-items:flex-start;">
        <span style="flex:none; width:9px; height:9px; border-radius:50%; background:${punkt}; margin-top:6px;"></span>
        <div style="min-width:0;">
          <p style="margin:0; font-weight:600;">${aktiv ? sicher(zeitHer(aktiv)) : "Noch nie angemeldet"}</p>
          <p class="est-sub" style="margin:2px 0 0;">${
            geraete.length === 0 ? "Kein Gerät angemeldet"
            : geraete.length === 1 ? "Läuft auf 1 Gerät"
            : "Läuft auf " + geraete.length + " Geräten"}</p>
        </div>
      </div>
      ${zeilen}
      ${geraete.length > 1 ? `<p class="est-sub" style="margin:10px 0 0;">
        Mehrere Geräte sind normal (Handy und Büro-Rechner). Passt eines davon nicht zu
        dieser Person, wurde der Zugang vermutlich weitergegeben – dann oben
        <b>Sperren</b> oder ein neues Einmal-Passwort.</p>` : ""}`;
  }

  // ---- Mitarbeiter-Aktionen ----------------------------------------------
  function maOeffnen(id) { offenerMa = offenerMa === id ? null : id; render(); }
  function maNeu() { bearbeiten = { id: null, name: "", arbeitstage: "mo_fr", urlaubsanspruch: 30 }; render(); }
  function maBearbeiten(id) {
    bearbeiten = mitarbeiter.find((x) => x.id === id) || null;
    render();
  }

  function neueId() {
    const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const zufall = crypto.getRandomValues(new Uint32Array(6));
    let aus = "";
    for (let i = 0; i < 6; i++) aus += zeichen[zufall[i] % zeichen.length];
    return aus;
  }

  async function maSpeichern() {
    const name = document.getElementById("f_name").value.trim();
    if (!name) { showToast("Bitte einen Namen eintragen"); return; }
    const anspruch = parseInt(document.getElementById("f_anspruch").value, 10);
    const zeile = {
      id: bearbeiten.id || neueId(),
      name,
      arbeitstage: document.getElementById("f_tage").value,
      urlaubsanspruch: isNaN(anspruch) ? 30 : Math.max(0, anspruch),
      zugang_glas: document.getElementById("f_glas").checked,
      zugang_graffiti: document.getElementById("f_graffiti").checked,
      zugang_checkin: document.getElementById("f_checkin").checked,
      zugang_lager: document.getElementById("f_lager").checked,
    };
    const { error } = await sb.from("glas_mitarbeiter").upsert(zeile);
    if (error) { showToast("Fehler: " + error.message); return; }
    showToast("Gespeichert ✓");
    bearbeiten = null;
    allesLaden();
  }

  async function maLoeschen(id) {
    const m = mitarbeiter.find((x) => x.id === id);
    const k = ((zugangsdaten && zugangsdaten.mitarbeiter) || []).find((x) => x.id === id);
    const anzahl = urlaube.filter((u) => u.mitarbeiter_id === id).length;
    if (!confirm(`${m ? m.name : "Diesen Mitarbeiter"} wirklich löschen?`
      + (anzahl ? `\n\nDazu gehören ${anzahl} Urlaubseinträge.` : "")
      + (k && k.hat_konto ? "\n\nSein Anmeldezugang wird mit entfernt." : "")
      + "\n\nTipp: Zum Ausscheiden reicht meist Sperren – dann bleibt die Historie erhalten.")) return;

    // Erst das Konto: sonst bliebe ein Zugang uebrig, der zu niemandem gehoert.
    if (k && k.hat_konto) {
      const erg = await ruf({ aktion: "konto_loeschen", mitarbeiter_id: id });
      if (erg.error) { showToast("Zugang konnte nicht entfernt werden: " + erg.error); return; }
    }
    if (anzahl) await sb.from("glas_urlaub").delete().eq("mitarbeiter_id", id);
    const { error } = await sb.from("glas_mitarbeiter").delete().eq("id", id);
    if (error) { showToast("Fehler: " + error.message); return; }
    showToast("Gelöscht");
    bearbeiten = null; offenerMa = null; detailMa = null;
    allesLaden();
  }

  // ==== Benachrichtigungen ================================================
  // EIN Knopf fuer alles. Technisch steckt hinter allen Bereichen eine einzige
  // Browser-Anmeldung dieses Geraets; die "Kanaele" sind nur Zeilen in der
  // Tabelle (Schluessel: endpoint + role). Es gibt also keinen Grund, den
  // Nutzer dafuer durch vier Apps zu schicken.
  const GEKO_BEREICHE = [
    { rolle: "glas", icon: "🪟", name: "Glasreinigung" },
    { rolle: "kalender", icon: "📅", name: "Kalender" },
    { rolle: "graffiti", icon: "🎨", name: "Graffiti" },
    { rolle: "checkin_admin", icon: "📍", name: "Check-ins" },
  ];

  function renderPush() {
    const e = pushEinstellungen || {};
    const erlaubnis = (typeof Notification !== "undefined") ? Notification.permission : "unsupported";
    const fehlen = GEKO_BEREICHE.filter((b) => !meineAbos.includes(b.rolle));

    // Pro Bereich ein eigener Schalter: manche wollen z.B. Touren, aber keine
    // Check-ins. Der Test geht jeweils ueber DIESEN Kanal - so sieht man
    // wirklich, ob dieser eine Bereich ankommt, und nicht nur irgendeiner.
    const zeile = (b) => {
      const an = meineAbos.includes(b.rolle);
      return `<div class="est-zeile">
        <label style="flex:1; min-width:150px; display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" style="width:auto;" ${an ? "checked" : ""}
                 onchange="pushBereich('${b.rolle}', this.checked)" />
          <span>
            <span class="est-name">${b.icon} ${b.name}</span>
            <span class="est-sub">${an ? "empfängt auf diesem Gerät" : "aus"}</span>
          </span>
        </label>
        <div class="est-btns">
          <button class="btn" ${an ? "" : "disabled"} onclick="testSenden('${b.rolle}', '${b.name}')">Test</button>
        </div>
      </div>`;
    };

    // Blockiert kann nur das Geraet selbst wieder freigeben - ein Knopf hier
    // waere wirkungslos, deshalb steht stattdessen der Weg dahin.
    if (erlaubnis === "denied") {
      return `
        <p class="est-sec-title">Benachrichtigungen · dieses Gerät</p>
        <div class="card">
          <p style="margin:0 0 8px; color:var(--danger); font-weight:600;">Dieses Gerät blockiert Benachrichtigungen.</p>
          <p class="muted" style="margin:0;">Das lässt sich nur am Gerät selbst aufheben: iPhone → Einstellungen → Apps → Safari → Erweitert → Website-Daten, oder in den Mitteilungs-Einstellungen der installierten App. Danach hier neu laden.</p>
        </div>
`;
    }

    return `
      <p class="est-sec-title">Benachrichtigungen · dieses Gerät</p>
      <div class="card">
        <p class="muted" style="margin:0 0 4px; font-size:12.5px;">Gilt für dieses Gerät. Auf einem weiteren Handy einmal genauso einschalten.</p>
        ${GEKO_BEREICHE.map(zeile).join("")}
        ${fehlen.length > 1 ? `<button class="btn btn-primary" style="margin-top:12px;" id="pushAnKnopf" onclick="pushAlleAktivieren()">🔔 Alle einschalten</button>` : ""}
        <p class="muted" style="margin:10px 0 0; font-size:12px;">„Test" schickt eine echte Benachrichtigung über genau diesen Kanal – <b>nur an dieses Gerät</b>, niemand sonst bekommt etwas mit.</p>
      </div>
`;
  }

  // Einzelnen Bereich an- oder abschalten.
  async function pushBereich(rolle, an) {
    if (an) {
      const erg = await gekoPushAktivierenFuer([rolle]);
      if (!erg.ok) {
        showToast(erg.grund === "abgelehnt"
          ? "Die Erlaubnis wurde nicht erteilt – ohne sie geht es leider nicht."
          : erg.grund === "nicht_unterstuetzt"
            ? "Dieses Gerät unterstützt keine Benachrichtigungen."
            : "Fehler: " + (erg.fehler || []).join(", "));
      } else showToast("Eingeschaltet ✓");
    } else {
      if (meinEndpoint) {
        await sb.from("push_subscriptions").delete().eq("endpoint", meinEndpoint).eq("role", rolle);
      }
      showToast("Ausgeschaltet");
    }
    await meineAbosLaden();
    render();
  }

  async function pushAlleAktivieren() {
    const knopf = document.getElementById("pushAnKnopf");
    if (knopf) { knopf.disabled = true; knopf.textContent = "Moment …"; }
    const erg = await gekoPushAktivierenFuer(GEKO_BEREICHE.map((b) => b.rolle));
    if (!erg.ok) {
      const text = erg.grund === "abgelehnt"
        ? "Die Erlaubnis wurde nicht erteilt – ohne sie geht es leider nicht."
        : erg.grund === "nicht_unterstuetzt"
          ? "Dieses Gerät unterstützt keine Benachrichtigungen."
          : "Fehler: " + (erg.fehler || []).join(", ");
      showToast(text);
      if (knopf) { knopf.disabled = false; knopf.textContent = "🔔 Für alle Bereiche einschalten"; }
      return;
    }
    showToast("Eingeschaltet ✓");
    await meineAbosLaden();
    render();
  }

  // Welche Kanaele empfaengt DIESES Geraet? Erkannt am Endpoint der
  // Browser-Anmeldung, der pro Geraet eindeutig ist.
  async function meineAbosLaden() {
    meinEndpoint = null;
    meineAbos = [];
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      meinEndpoint = sub.endpoint;
      const { data } = await sb.from("push_subscriptions").select("role").eq("endpoint", meinEndpoint);
      meineAbos = (data || []).map((r) => r.role);
    } catch (e) { /* ohne Anmeldung bleibt die Liste leer - das ist die Aussage */ }
  }

  async function testSenden(rolle, name) {
    if (!meinEndpoint) { showToast("Dieses Gerät ist nicht angemeldet"); return; }
    showToast("Test wird geschickt …");
    const token = await gekoToken();
    try {
      const antwort = await fetch(SUPABASE_URL + "/functions/v1/send-push", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY,
                   "Authorization": "Bearer " + (token || SUPABASE_ANON_KEY) },
        body: JSON.stringify({
          role: rolle,
          endpoint: meinEndpoint,          // nur an dieses eine Geraet
          title: "GEKO · Test " + name,
          body: "Wenn du das siehst, kommen " + name + "-Benachrichtigungen an ✓",
        }),
      });
      const erg = await antwort.json();
      if (erg.error) { showToast("Fehler: " + erg.error); return; }
      showToast(erg.sent ? name + ": verschickt ✓" : name + ": nicht zugestellt (0 Geräte)");
    } catch (e) { showToast("Keine Verbindung zum Versand"); }
  }

  // ==== Erinnerungen =======================================================
  // Bisher gab es nur Meldungen, wenn jemand etwas TUT. Das hier ist die
  // Gegenrichtung: eine Meldung, wenn etwas NICHT passiert ist.
  function renderErinnerungen() {
    const zeit = (pushEinstellungen || {}).lager_erinnerung_zeit || "";
    const an = !!zeit;
    const zeiten = [];
    for (let h = 12; h <= 22; h++) zeiten.push(String(h).padStart(2, "0") + ":00");

    return `
      <p class="est-sec-title">Erinnerungen</p>
      <div class="card">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" style="width:auto;" ${an ? "checked" : ""} onchange="lagerErinnerungUmschalten(this.checked)" />
          <span>
            <span class="est-name">📦 Lager-Plan für morgen</span>
            <span class="est-sub">Meldung, falls die Einteilung für den nächsten Tag noch nicht raus ist</span>
          </span>
        </label>
        ${an ? `
        <div style="display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
          <span style="font-size:14px;">Erinnern um</span>
          <select style="flex:0 0 auto; width:auto;" onchange="lagerErinnerungZeit(this.value)">
            ${zeiten.map((z) => `<option value="${z}" ${z === zeit ? "selected" : ""}>${z} Uhr</option>`).join("")}
          </select>
        </div>
        <p class="muted" style="margin:10px 0 0; font-size:12px;">Kommt nur, wenn bis dahin nichts verschickt wurde – und nie sonntags, weil montags ohnehin neu eingeteilt wird. Ist der Plan raus, bleibt es still.</p>`
        : ""}
      </div>`;
  }

  async function lagerErinnerungUmschalten(an) {
    const wert = an ? "18:00" : null;
    pushEinstellungen = { ...(pushEinstellungen || {}), lager_erinnerung_zeit: wert };
    const { error } = await sb.from("glas_einstellungen").upsert({ id: "default", lager_erinnerung_zeit: wert });
    if (error) {
      showToast(/lager_erinnerung/i.test(error.message || "")
        ? "Bitte supabase_add_lager_erinnerung.sql ausführen"
        : "Fehler: " + error.message);
      return;
    }
    showToast(an ? "Erinnerung an" : "Erinnerung aus");
    render();
  }

  async function lagerErinnerungZeit(zeit) {
    pushEinstellungen = { ...(pushEinstellungen || {}), lager_erinnerung_zeit: zeit };
    const { error } = await sb.from("glas_einstellungen").upsert({ id: "default", lager_erinnerung_zeit: zeit });
    if (error) { showToast("Fehler: " + error.message); return; }
    showToast("Gespeichert – " + zeit + " Uhr");
  }

  function renderDarstellung() {
    let t = "auto";
    try { t = localStorage.getItem("geko_theme") || "auto"; } catch (e) {}
    const knopf = (wert, label) => `<button class="glas-seg-btn ${t === wert ? "on" : ""}" onclick="themeSetzen('${wert}')">${label}</button>`;
    return `
      <p class="est-sec-title">Darstellung</p>
      <div class="card">
        <p class="muted" style="margin:0 0 10px;">„Automatisch" folgt dem Handy. Gilt für dieses Gerät auf allen GEKO-Seiten.</p>
        <div class="glas-seg">${knopf("auto", "📱 Automatisch")}${knopf("light", "☀️ Hell")}${knopf("dark", "🌙 Dunkel")}</div>
      </div>`;
  }

  // ---- Aktionen ----------------------------------------------------------
  function themeSetzen(modus) {
    try { localStorage.setItem("geko_theme", modus); } catch (e) {}
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    document.documentElement.classList.toggle("dark", modus === "dark" || (modus === "auto" && mq.matches));
    render();
  }

  async function pushSchalter(key, wert) {
    pushEinstellungen = { ...(pushEinstellungen || {}), id: "default", [key]: wert };
    const { error } = await sb.from("glas_einstellungen").upsert({ id: "default", [key]: wert });
    if (error) { showToast("Fehler: " + error.message); return; }
    showToast(wert ? "Eingeschaltet" : "Ausgeschaltet");
  }

  async function abmelden() {
    if (!confirm("Wirklich abmelden?\n\nDu musst dich danach mit E-Mail und Passwort neu anmelden – auf allen GEKO-Seiten.")) return;
    await gekoAbmelden();
    location.reload();
  }

  const dlg = document.getElementById("dlg");
  function zeigeDialog(html) { document.getElementById("dlgInhalt").innerHTML = html; dlg.showModal(); }

  // Zettel nach Anlegen/Zuruecksetzen: das Passwort ist genau HIER das letzte
  // Mal sichtbar.
  function zettel(name, benutzername, passwort) {
    zeigeDialog(`
      <h3 style="margin:0 0 4px;">Zugangsdaten für ${sicher(name)}</h3>
      <p class="muted" style="margin:0; font-size:13px;"><b>Das Passwort siehst du nur jetzt.</b> Beim ersten Anmelden wird ein eigenes gesetzt.</p>
      <div class="est-zettel">Benutzername: <code>${sicher(benutzername)}</code><br>Passwort: <code>${sicher(passwort)}</code></div>
      <button class="btn" style="width:100%; margin-top:12px;" onclick="navigator.clipboard.writeText('Benutzername: ${jsText(benutzername)}\\nPasswort: ${jsText(passwort)}').then(()=>showToast('Kopiert ✓')).catch(()=>showToast('Bitte abschreiben'))">Zum Kopieren</button>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="dlg.close(); allesLaden();">Fertig</button>`);
  }

  function dlgAnlegen(maId) {
    const m = (zugangsdaten.mitarbeiter || []).find((x) => x.id === maId);
    if (!m) return;
    const vorschlag = m.username || String(m.name || "").trim().toLowerCase()
      .replace(/[ä]/g,"ae").replace(/[ö]/g,"oe").replace(/[ü]/g,"ue").replace(/ß/g,"ss")
      .replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean).map((t,i)=>i===0?t:t.slice(0,1)).join("");
    zeigeDialog(`
      <h3 style="margin:0 0 10px;">Zugang für ${sicher(m.name)}</h3>
      <div class="field"><label class="muted">Benutzername</label>
        <input id="dU" value="${sicher(vorschlag)}" autocapitalize="none" spellcheck="false" /></div>
      <label style="display:flex; align-items:center; gap:8px; margin:10px 0; cursor:pointer;">
        <input type="checkbox" id="dAdmin" style="width:auto;" /> <span>Verwaltungs-Zugang <span class="muted">(sieht alles)</span></span></label>
      <p class="muted" id="dFehler" style="color:var(--danger); margin:0 0 6px;"></p>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:1;" onclick="dlg.close()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:2;" id="dOk">Anlegen</button></div>`);
    document.getElementById("dOk").onclick = async () => {
      const benutzername = document.getElementById("dU").value.trim();
      const rolle = document.getElementById("dAdmin").checked ? "admin" : "mitarbeiter";
      const passwort = passwortVorschlag();
      const erg = await ruf({ aktion: "anlegen", mitarbeiter_id: maId, benutzername, passwort, rolle });
      if (erg.error) { document.getElementById("dFehler").textContent = erg.error; return; }
      zettel(m.name, erg.benutzername, passwort);
    };
  }

  function dlgAdminAnlegen() {
    zeigeDialog(`
      <h3 style="margin:0 0 4px;">Verwaltungs-Zugang</h3>
      <p class="muted" style="margin:0 0 10px; font-size:13px;">Für jemanden, der kein Mitarbeiter in den Apps ist. Benutzername oder echte E-Mail-Adresse.</p>
      <div class="field"><label class="muted">Name (zur Anzeige)</label><input id="dName" /></div>
      <div class="field"><label class="muted">Benutzername oder E-Mail</label>
        <input id="dU" autocapitalize="none" spellcheck="false" /></div>
      <p class="muted" id="dFehler" style="color:var(--danger); margin:0 0 6px;"></p>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:1;" onclick="dlg.close()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:2;" id="dOk">Anlegen</button></div>`);
    document.getElementById("dOk").onclick = async () => {
      const benutzername = document.getElementById("dU").value.trim();
      const name = document.getElementById("dName").value.trim();
      const passwort = passwortVorschlag();
      const erg = await ruf({ aktion: "admin_anlegen", benutzername, name, passwort });
      if (erg.error) { document.getElementById("dFehler").textContent = erg.error; return; }
      zettel(name || benutzername, erg.benutzername, passwort);
    };
  }

  async function aktionPasswort(maId, userId, name) {
    if (!confirm(`Neues Einmal-Passwort für ${name}?\n\nDas alte gilt danach nicht mehr.`)) return;
    const passwort = passwortVorschlag();
    const erg = await ruf({ aktion: "passwort_neu", mitarbeiter_id: maId || "", user_id: userId || "", passwort });
    if (erg.error) { showToast("Fehler: " + erg.error); return; }
    const m = maId ? (zugangsdaten.mitarbeiter || []).find((x) => x.id === maId) : null;
    zettel(name, m ? m.username : name, passwort);
  }

  async function aktionSperre(maId, userId, istGesperrt, name) {
    if (!istGesperrt && !confirm(`${name} sperren?\n\nAnmelden geht dann nicht mehr, alle Daten bleiben erhalten.`)) return;
    const erg = await ruf({ aktion: istGesperrt ? "entsperren" : "sperren", mitarbeiter_id: maId || "", user_id: userId || "" });
    if (erg.error) { showToast("Fehler: " + erg.error); return; }
    showToast(istGesperrt ? "Entsperrt" : "Gesperrt");
    allesLaden();
  }

  async function aktionRolle(maId, rolle, name) {
    const neu = rolle === "admin" ? "mitarbeiter" : "admin";
    const text = neu === "admin"
      ? `${name} zur Verwaltung machen?\n\nSieht dann ALLES und kann Zugänge vergeben.`
      : `${name} zum Mitarbeiter machen?\n\nSieht dann nur noch seine eigenen Daten.`;
    if (!confirm(text)) return;
    const erg = await ruf({ aktion: "rolle_setzen", mitarbeiter_id: maId, rolle: neu });
    if (erg.error) { showToast("Fehler: " + erg.error); return; }
    showToast("Rolle geändert");
    allesLaden();
  }

  async function aktionLoeschen(userId, name) {
    if (!confirm(`Das Konto von ${name} endgültig löschen?`)) return;
    const erg = await ruf({ aktion: "konto_loeschen", user_id: userId });
    if (erg.error) { showToast("Fehler: " + erg.error); return; }
    showToast("Konto gelöscht");
    allesLaden();
  }

  function dlgEigenesPasswort() {
    zeigeDialog(`
      <h3 style="margin:0 0 10px;">Eigenes Passwort ändern</h3>
      <div class="field"><label class="muted">Aktuelles Passwort</label>
        <input id="dAlt" type="password" autocomplete="current-password" /></div>
      <div class="field"><label class="muted">Neues Passwort (mind. 8 Zeichen)</label>
        <input id="dNeu" type="password" autocomplete="new-password" /></div>
      <div class="field"><label class="muted">Nochmal zur Sicherheit</label>
        <input id="dNeu2" type="password" autocomplete="new-password" /></div>
      <p class="muted" id="dFehler" style="color:var(--danger); margin:0 0 6px;"></p>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:1;" onclick="dlg.close()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:2;" id="dOk">Speichern</button></div>`);
    document.getElementById("dOk").onclick = async () => {
      const alt = document.getElementById("dAlt").value;
      const neu = document.getElementById("dNeu").value;
      const neu2 = document.getElementById("dNeu2").value;
      const meckern = (t) => { document.getElementById("dFehler").textContent = t; };
      if (neu.length < 8) return meckern("Mindestens 8 Zeichen.");
      if (neu !== neu2) return meckern("Die beiden Eingaben sind nicht gleich.");
      // Altes Passwort per Probe-Anmeldung pruefen - Supabase kennt beim
      // Aendern selbst keine "altes Passwort"-Abfrage.
      const { error: eAlt } = await sb.auth.signInWithPassword({ email: meineSitzung.user.email, password: alt });
      if (eAlt) return meckern("Das aktuelle Passwort stimmt nicht.");
      const { error } = await sb.auth.updateUser({ password: neu });
      if (error) return meckern(error.message);
      dlg.close();
      showToast("Passwort geändert ✓");
    };
  }

  // ---- Start -------------------------------------------------------------
  // Sofort starten: dieses Script liegt hinter geko-auth.js, alles Noetige ist
  // da. Das fruehere Warten aufs "load"-Ereignis hielt den Pruef-Deckel, bis
  // auch jspdf & Co. fertig geladen waren.
  gekoSchuetze({ nurAdmin: true, overlay: true, titel: "GEKO Einstellungen",
    weiter: (sitzung) => { meineSitzung = sitzung; allesLaden(); } });
  </script>
</body>
</html>
