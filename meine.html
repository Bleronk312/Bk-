<style>
/* Nur die GEKO-One-eigenen Bausteine - alles andere kommt aus style.css,
   damit die Seite exakt aussieht wie der Rest der App-Familie. */
.one-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.one-kachel {
  display: block; text-align: left; text-decoration: none; font-family: inherit;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 15px 14px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(16,42,67,.06);
  transition: transform .12s ease;
  opacity: 0; animation: oneRein .45s ease forwards;
}
.one-kachel:active { transform: scale(.96); }
.one-kachel .k-ico {
  width: 42px; height: 42px; border-radius: 13px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; margin-bottom: 10px;
}
.one-kachel b { display: block; font-size: 14.5px; color: var(--text); line-height: 1.25; }
.one-kachel span { display: block; font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.35; }
.one-kachel.bald { opacity: 0; animation: oneReinHalb .45s ease forwards; cursor: default; }
.one-kachel.bald .k-ico { background: var(--border) !important; color: var(--text-secondary); }
.one-label { font-size: 11px; font-weight: 800; letter-spacing: .09em; color: var(--text-secondary); margin: 18px 2px 0; }
@keyframes oneRein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes oneReinHalb { from { opacity: 0; transform: translateY(10px); } to { opacity: .62; transform: none; } }
html.dark .one-kachel { box-shadow: 0 2px 10px rgba(0,0,0,.35); }

/* Kopf-Identität rechts (Nav-Knöpfe stehen links) */
.one-brand { margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 13.5px; opacity: .92; }

/* Eigener, symmetrischer Willkommensblock (der geerbte hatte oben 6px und unten
   60px Abstand - dadurch wirkte die Startseite unten "abgesackt"). */
/* Kompakt: das Logo steht schon als Kreis oben links - ein zweites, großes in der
   Mitte war doppelt und hat die Seite unnötig auseinandergezogen. */
.one-welcome { text-align: center; padding: 14px 16px 4px; }
.one-welcome .w-titel { margin: 0 0 3px; font-size: 23px; font-weight: 800;
  letter-spacing: -.3px; animation: glasFadeUp .5s ease .08s both; }
.one-welcome .w-sub { margin: 0; font-size: 13.5px; color: var(--text-secondary);
  animation: glasFadeUp .5s ease .18s both; }

/* Entscheidung des Büros zum Urlaubsantrag - steht auf der Startseite, bis der
   Mitarbeiter sie bestätigt. Danach nur noch in der Antrags-Historie. */
.one-info { display: flex; align-items: flex-start; gap: 12px; border-radius: 15px;
  padding: 14px 15px; margin-top: 14px; border: 1.5px solid;
  animation: oneRein .45s ease both; }
.one-info.gut { background: #e8f6ee; border-color: #12a150; }
.one-info.schlecht { background: #fdeeea; border-color: #d0654a; }
html.dark .one-info.gut { background: #12301f; border-color: #1e7d4d; }
html.dark .one-info.schlecht { background: #341c16; border-color: #a24b33; }
.one-info .oi-ic { font-size: 24px; flex: none; line-height: 1.1; }
.one-info .oi-txt { flex: 1; min-width: 0; }
.one-info .oi-txt b { display: block; font-size: 14.5px; color: var(--text); }
.one-info .oi-txt span { display: block; font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.one-info .oi-btn { flex: none; align-self: center; border: 1px solid var(--border);
  background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 13px;
  font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.one-info .oi-btn:active { transform: scale(.95); }

/* Menü-Zeilen (Einstellungen) */
.one-menu-row { display: flex; align-items: center; gap: 13px; width: 100%; background: var(--card);
  border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; margin-bottom: 10px;
  cursor: pointer; text-align: left; font-family: inherit; }
.one-menu-row .m-ico { width: 38px; height: 38px; border-radius: 11px; flex: none; display: flex;
  align-items: center; justify-content: center; font-size: 19px; background: var(--bg); }
.one-menu-row b { display: block; font-size: 14.5px; color: var(--text); }
.one-menu-row span { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.one-menu-row .m-pfeil { margin-left: auto; color: var(--text-secondary); font-size: 18px; flex: none; }
.one-seg { display: flex; gap: 6px; }
.one-seg button { flex: 1; border: 1px solid var(--border); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.one-seg button.on { background: var(--blue); color: #fff; border-color: var(--blue); }

/* Kalender */
.okal-kopf { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
.okal-wochentage { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 5px; }
.okal-wochentage span { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); }
.okal-raster { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.okal-tag { position: relative; aspect-ratio: 1; border: 1px solid var(--border); background: var(--card);
  border-radius: 10px; font-family: inherit; cursor: pointer; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.okal-tag.leer { border: 0; background: transparent; cursor: default; }
.okal-tag .okal-num { font-size: 13px; font-weight: 600; color: var(--text); }
/* Heute = blauer Rahmen. Ausgewählter Tag = ausgefüllt (wandert beim Antippen mit). */
.okal-tag.heute { border-color: var(--blue); border-width: 2px; }
.okal-tag.heute .okal-num { color: var(--blue); font-weight: 800; }
.okal-tag.gewaehlt { background: var(--blue); border-color: var(--blue); }
.okal-tag.gewaehlt .okal-num { color: #fff; font-weight: 800; }
.okal-tag.gewaehlt .okal-punkte i { box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); }
.okal-schloss { margin-left: auto; font-size: 14px; opacity: .8; flex: none; align-self: center; }
/* Kräftigere, größere Punkte - vorher waren 5px kaum zu erkennen */
.okal-tag .okal-punkte { display: flex; gap: 3px; height: 8px; }
.okal-tag .okal-punkte i { width: 7px; height: 7px; border-radius: 50%; display: block; }
/* Tage mit Terminen bekommen zusätzlich einen leichten Farbton */
.okal-tag.hat { background: var(--blue-050, rgba(22,104,184,.06)); border-color: rgba(22,104,184,.22); }
html.dark .okal-tag.hat { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); }
.okal-legende { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 14px; }
.okal-legende span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); font-weight: 500; }
.okal-legende i { width: 10px; height: 10px; border-radius: 50%; display: block; }
/* Erledigter Eintrag: durchgestrichen und zurückgenommen */
.okal-fertig { text-decoration: line-through; opacity: .72; }
.okal-eintrag { display: flex; align-items: stretch; gap: 11px; background: var(--card); border: 1px solid var(--border);
  border-radius: 13px; padding: 11px 13px; margin-bottom: 8px; text-decoration: none; overflow: hidden; }
.okal-strich { width: 4px; border-radius: 3px; flex: none; }
.okal-eintrag b { display: block; font-size: 14px; color: var(--text); }
.okal-eintrag span span, .okal-eintrag > span > span { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
</style>
