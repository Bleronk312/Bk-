<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GEKO One</title>
<meta name="theme-color" content="#1f5d92" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta http-equiv="refresh" content="0; url=meine.html" />
<!--
  Die nackte Adresse gehoert den Mitarbeitern - sie ist die, die man am Telefon
  durchgibt. Die Verwaltung erreicht ihren Hub ueber /admin.

  Normalerweise kommt diese Datei gar nicht zum Zug: die Regel "/ -> /meine.html"
  in _redirects liefert GEKO One direkt aus, ohne dass die Adresse sich aendert.
  Diese Seite ist das Netz darunter - fuer den Fall, dass jemand /index.html
  ausdruecklich aufruft oder die Regel einmal nicht greift. Deshalb sowohl
  meta-refresh (ohne JavaScript) als auch location.replace (kein Eintrag in der
  Zurueck-Liste, sonst haengt man beim Zurueckgehen in einer Schleife).

  Frueher stand hier eine feste Weiterleitung auf die Graffiti-Seite (damals
  admin.html) - ein Ueberbleibsel aus der Zeit, als dieses Projekt nur die
  Graffiti-Abteilung war.
-->
<style>
  body{margin:0;min-height:100svh;background:#1f5d92;color:#cfe0ee;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;font-size:15px}
</style>
</head>
<body>
<p>GEKO One wird geöffnet … <a href="meine.html" style="color:#fff">weiter</a></p>
<script>location.replace("meine.html");</script>
</body>
</html>
