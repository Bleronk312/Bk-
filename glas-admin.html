<script>if(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))document.documentElement.classList.add("app-mode");</script>
<script>(function(){try{var mq=window.matchMedia("(prefers-color-scheme: dark)");function ap(){var m=localStorage.getItem("geko_theme")||"auto";document.documentElement.classList.toggle("dark",m==="dark"||(m==="auto"&&mq.matches));}ap();if(mq.addEventListener)mq.addEventListener("change",ap);}catch(e){}})();</script>
</head>
<body class="glas-logo-left glas-shell">

  <!-- PIN-Sperre nur für den Glas-Admin-Bereich. Einmal korrekt eingeben, danach merkt
       sich das Gerät die Freischaltung dauerhaft (localStorage). Hinweis: rein clientseitig
       - ein einfaches Geräte-Schloss, keine harte Zugriffssicherung. -->
  <div id="glasPinGate" style="display:none; position:fixed; inset:0; z-index:99999; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; align-items:center; justify-content:center; flex-direction:column; padding:24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="width:100%; max-width:300px; text-align:center;">
      <div style="font-size:42px; margin-bottom:10px;">🔒</div>
      <h1 style="font-size:20px; margin:0 0 4px; font-weight:800;">Glasreinigung</h1>
      <p style="opacity:.75; font-size:14px; margin:0 0 22px;">Bitte PIN eingeben</p>
      <input id="glasPinInput" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="16"
        style="width:100%; box-sizing:border-box; text-align:center; font-size:22px; letter-spacing:6px; padding:14px; border-radius:14px; border:0; background:rgba(255,255,255,.16); color:#fff; outline:none;" placeholder="••••••••" />
      <p id="glasPinErr" style="color:#ffd2ca; font-size:13px; min-height:18px; margin:10px 0 0;"></p>
      <button id="glasPinBtn" style="margin-top:12px; width:100%; padding:14px; border-radius:14px; border:0; background:#fff; color:#1f5d92; font-size:16px; font-weight:700; cursor:pointer;">Entsperren</button>
    </div>
  </div>
  <script>
  (function(){
    var KEY = "geko_glas_pin_ok";
    try { if (localStorage.getItem(KEY) === "1") return; } catch(e){}
    var gate = document.getElementById("glasPinGate");
    var inp  = document.getElementById("glasPinInput");
    var err  = document.getElementById("glasPinErr");
    var btn  = document.getElementById("glasPinBtn");
    if (!gate) return;
    gate.style.display = "flex";
    try { document.documentElement.style.overflow = "hidden"; } catch(e){}
    setTimeout(function(){ try { inp.focus(); } catch(e){} }, 120);
    function tryUnlock(){
      if (inp.value === "19952000") {
        try { localStorage.setItem(KEY, "1"); } catch(e){}
        gate.style.display = "none";
        try { document.documentElement.style.overflow = ""; } catch(e){}
      } else {
        err.textContent = "Falscher PIN – bitte erneut versuchen.";
        inp.value = "";
        try { inp.focus(); } catch(e){}
      }
    }
    btn.addEventListener("click", tryUnlock);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); tryUnlock(); } });
  })();
  </script>

  <!-- App-Shell: Auf dem Handy scrollt NUR dieser Container, nie das Fenster selbst.
       Dadurch kann die feste untere Reiterleiste nicht mehr mitrutschen (Safari-Leiste
       und Gummiband-Effekt zogen sonst fixe Elemente optisch mit). -->
  <div id="glasScroller">
    <div class="app-header">
      <div class="brand-row"><a href="hub.html" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;"><span class="dot"></span>GEKO Hub</a><a href="hub.html" class="btn btn-sm" style="margin-left:auto; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); color:white;">⌂ Hub</a></div>
      <div class="greeting">Glasreinigung – Planung &amp; Touren</div>
    </div>
    <div class="app-sheet">
      <img class="logo-watermark" id="watermarkImg" alt="" />
      <div class="logo-badge" style="cursor:pointer;" title="Zur Startseite" onclick="goGlasHome()"><img id="badgeLogoImg" alt="Logo" /></div>
      <div class="app-sheet-content glas-static">
        <div class="wrap" style="padding:0 18px 24px;">
          <div id="view"><p class="muted"><span class="spinner"></span>Lade...</p></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script defer src="js/pdf-template.js?v=60"></script>
  <script defer src="js/glas-logo-sub.js?v=60"></script>
