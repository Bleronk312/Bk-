<script>if(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))document.documentElement.classList.add("app-mode");</script>
<script>(function(){try{var mq=window.matchMedia("(prefers-color-scheme: dark)");function ap(){var m=localStorage.getItem("geko_theme")||"auto";document.documentElement.classList.toggle("dark",m==="dark"||(m==="auto"&&mq.matches));}ap();if(mq.addEventListener)mq.addEventListener("change",ap);}catch(e){}})();</script>

<body class="glas-logo-left glas-shell">
  <div id="gekoAuthOverlay" style="position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px;">Anmeldung wird gepr&uuml;ft &hellip;</div>

  <!-- Zugangsschutz: echte Anmeldung statt PIN. Das Overlay legt sich vor die
       App, bis ein angemeldeter Admin bestaetigt ist. Laeuft nach "load", weil
       geko-auth.js und supabase-js erst am Seitenende geladen werden. -->
  <script>
  (function () {
    try { localStorage.removeItem("geko_glas_pin_ok"); } catch (e) {}
    // Anforderungen fuer die echte Pruefung - gestartet wird sie von
    // geko-auth.js, sobald es geladen ist (nicht mehr beim "load"-Ereignis).
    window.__gekoGate = { nurAdmin: true, overlay: true, titel: "Glas-Verwaltung" };
    // Schnellstart gegen das Aufblitzen: Passt die oertlich gespeicherte
    // Anmeldung zum gemerkten Profil und erfuellt sie die Anforderung dieser
    // Seite, verschwindet der Pruef-Deckel sofort - noch bevor irgendeine
    // Bibliothek laedt. Faellt die echte Pruefung anders aus, kommt er zurueck
    // (gekoZeigeLogin/gekoZeigeSperre bauen ihn neu auf).
    try {
      var s = JSON.parse(localStorage.getItem("geko_auth") || "null");
      var p = JSON.parse(localStorage.getItem("geko_profil") || "null");
      var u = s && (s.user || (s.currentSession && s.currentSession.user));
      if (u && p && p.uid === u.id && (p.rolle === "admin")) {
        var o = document.getElementById("gekoAuthOverlay");
        if (o) o.style.display = "none";
      }
    } catch (e) {}
  })();
  </script>

  <!-- App-Shell: Auf dem Handy scrollt NUR dieser Container, nie das Fenster selbst.
       Dadurch kann die feste untere Reiterleiste nicht mehr mitrutschen (Safari-Leiste
       und Gummiband-Effekt zogen sonst fixe Elemente optisch mit). -->
  <div id="glasScroller">
    <div class="app-header">
      <div class="brand-row geko-navrow"><a href="hub.html" class="geko-hubbtn" title="Zur Startseite"><span class="hb-ic">⌂</span>Hub</a><span class="geko-brand"><span class="dot"></span>GEKO Hub</span></div>
      <div class="greeting">Glasreinigung – Planung &amp; Touren</div>
    </div>
    <div class="app-sheet">
      <img class="logo-watermark" id="watermarkImg" alt="" />
      <div class="logo-badge" style="cursor:pointer;" title="Zur Startseite" onclick="goGlasHome()"><img id="badgeLogoImg" alt="Logo" /></div>
      <div class="app-sheet-content glas-static">
        <div class="wrap" style="padding:0 18px 24px;">
          <div id="view"><p class="muted"><span class="spinner"></span>Lade...</p></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
