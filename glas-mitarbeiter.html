<script>(function(){try{var mq=window.matchMedia("(prefers-color-scheme: dark)");function ap(){var m=localStorage.getItem("geko_theme")||"auto";document.documentElement.classList.toggle("dark",m==="dark"||(m==="auto"&&mq.matches));}ap();if(mq.addEventListener)mq.addEventListener("change",ap);}catch(e){}})();</script>

<body class="glas-logo-left">

  <div class="app-header">
    <div class="brand-row"><span class="dot"></span>Glasreinigung</div>
    <div class="greeting">Meine Touren</div>
  </div>
  <div class="app-sheet">
    <img class="logo-watermark" id="watermarkImg" alt="" />
    <div class="logo-badge" style="cursor:pointer;" title="Zur Startseite" onclick="glasMaGoHome()"><img id="badgeLogoImg" alt="Logo" /></div>
    <div class="app-sheet-content glas-static">
      <div class="wrap" style="max-width:560px; padding:0 18px 24px;">
        <div id="view"><p class="muted"><span class="spinner"></span>Lade...</p></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- "Als App installieren"-Hinweis: erscheint NUR im Browser (nie in der installierten
       App) und nur auf iPhone/Android. iOS kann die Installation technisch nicht per Knopf
       auslösen - dort zeigt der Hinweis die zwei Tippschritte (Teilen -> Zum Home-Bildschirm).
       Android bekommt über beforeinstallprompt einen echten Installieren-Knopf.
       "Später" versteckt den Hinweis nur für die aktuelle Sitzung - beim nächsten Öffnen
       im Browser kommt er wieder (gewollt: MA sollen die App vom Home-Bildschirm nutzen). -->
  <div id="a2hs" style="display:none; position:fixed; left:12px; right:12px; bottom:14px; z-index:9990; background:linear-gradient(140deg,#1f5d92,#143c5e); color:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 12px 34px rgba(10,30,50,.4); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; max-width:560px; margin:0 auto;">
    <div style="display:flex; gap:12px; align-items:flex-start;">
      <span style="font-size:26px; flex:none;">📲</span>
      <div style="flex:1; min-width:0;">
        <p style="margin:0; font-weight:800; font-size:15px;">GEKO Touren als App aufs Handy</p>
        <p id="a2hsText" style="margin:5px 0 0; font-size:13px; line-height:1.55; color:#d6e4f2;"></p>
      </div>
      <button id="a2hsZu" aria-label="Später" style="flex:none; border:0; background:rgba(255,255,255,.16); color:#fff; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer;">✕</button>
    </div>
    <button id="a2hsBtn" style="display:none; margin-top:11px; width:100%; border:0; border-radius:11px; padding:12px; background:#fff; color:#1f5d92; font-size:15px; font-weight:800; cursor:pointer;">Jetzt installieren</button>
  </div>
  <script>
  (function(){
    var standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (standalone) return; // läuft schon als App -> kein Hinweis
    try { if (sessionStorage.getItem("geko_a2hs_zu") === "1") return; } catch(e){}
    var box = document.getElementById("a2hs");
    var text = document.getElementById("a2hsText");
    var btn = document.getElementById("a2hsBtn");
    var zu = document.getElementById("a2hsZu");
    if (!box || !text || !btn || !zu) return;
    var ua = navigator.userAgent || "";
    // iPadOS meldet sich als "MacIntel" mit Touch - auch das ist ein iOS-Gerät
    var isIos = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);
    if (!isIos && !isAndroid) return; // am PC kein Hinweis
    zu.addEventListener("click", function(){
      box.style.display = "none";
      try { sessionStorage.setItem("geko_a2hs_zu", "1"); } catch(e){}
    });
    var teilenIcon = '<svg width="13" height="16" viewBox="0 0 14 17" style="vertical-align:-2px;" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v10"/><path d="M4 3.5 7 1l3 2.5"/><path d="M4.5 6H3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H9.5"/></g></svg>';
    if (isIos) {
      text.innerHTML = 'Tippe unten in Safari auf ' + teilenIcon + ' <b>Teilen</b> und dann auf <b>&bdquo;Zum Home-Bildschirm&ldquo;</b> &rarr; <b>Hinzuf&uuml;gen</b>. Danach liegt die App mit eigenem Symbol auf deinem Handy.';
      box.style.display = "block";
      return;
    }
    // Android: echter Installieren-Knopf, sobald der Browser die Installation anbietet
    var installEvent = null;
    var gezeigt = false;
    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault();
      installEvent = e;
      gezeigt = true;
      text.textContent = "Ein Tipp genügt – danach liegt GEKO Touren mit eigenem Symbol auf deinem Startbildschirm.";
      btn.style.display = "block";
      box.style.display = "block";
    });
    btn.addEventListener("click", function(){
      if (!installEvent) return;
      installEvent.prompt();
      installEvent = null;
      btn.style.display = "none";
    });
    window.addEventListener("appinstalled", function(){ box.style.display = "none"; });
    // Browser ohne Installations-Angebot (z.B. Firefox): Tippschritte fürs Menü zeigen
    setTimeout(function(){
      if (gezeigt) return;
      text.innerHTML = '&Ouml;ffne rechts oben das Men&uuml; <b>&#8942;</b> und w&auml;hle <b>&bdquo;App installieren&ldquo;</b> bzw. <b>&bdquo;Zum Startbildschirm hinzuf&uuml;gen&ldquo;</b>.';
      box.style.display = "block";
    }, 2600);
  })();
  </script>
