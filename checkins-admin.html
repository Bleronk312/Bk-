  <div id="gekoAuthOverlay" style="position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px;">Anmeldung wird gepr&uuml;ft &hellip;</div>

  <!-- Zugangsschutz: echte Anmeldung statt PIN. Das Overlay legt sich vor die
       App, bis ein angemeldeter Admin bestaetigt ist. Laeuft nach "load", weil
       geko-auth.js und supabase-js erst am Seitenende geladen werden. -->
  <script>
  window.addEventListener("load", function () {
    try { localStorage.removeItem("geko_ci_pin_ok"); } catch (e) {}   // alte PIN-Freischaltung verfaellt
    gekoSchuetze({ nurAdmin: true, overlay: true, titel: "Check-ins Verwaltung" });
  });
  </script>

  <div class="ci-head admin-head">

    </div>
    <h1>📍 Check-ins · Admin</h1>
    <div class="sub" id="ci_date">Heute</div>
  </div>

  <div class="ci-wrap admin">
    <div class="ci-body">
      <div id="view"><p class="ci-empty"><span class="spin spinner-dark"></span> Lade…</p></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
