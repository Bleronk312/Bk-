<script>(function(){try{var mq=window.matchMedia("(prefers-color-scheme: dark)");function ap(){var m=localStorage.getItem("geko_theme")||"auto";document.documentElement.classList.toggle("dark",m==="dark"||(m==="auto"&&mq.matches));}ap();if(mq.addEventListener)mq.addEventListener("change",ap);}catch(e){}})();</script>

<body>

  <!-- PIN-Sperre nur für den Check-ins-Admin-Bereich (Geräte-Schloss, clientseitig). -->
  <div id="ciPinGate" style="display:none; position:fixed; inset:0; z-index:99999; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; align-items:center; justify-content:center; flex-direction:column; padding:24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="width:100%; max-width:300px; text-align:center;">
      <div style="font-size:42px; margin-bottom:10px;">🔒</div>
      <h1 style="font-size:20px; margin:0 0 4px; font-weight:800;">Check-ins · Admin</h1>
      <p style="opacity:.75; font-size:14px; margin:0 0 22px;">Bitte PIN eingeben</p>
      <input id="ciPinInput" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="16"
        style="width:100%; box-sizing:border-box; text-align:center; font-size:22px; letter-spacing:6px; padding:14px; border-radius:14px; border:0; background:rgba(255,255,255,.16); color:#fff; outline:none;" placeholder="••••••••" />
      <p id="ciPinErr" style="color:#ffd2ca; font-size:13px; min-height:18px; margin:10px 0 0;"></p>
      <button id="ciPinBtn" style="margin-top:12px; width:100%; padding:14px; border-radius:14px; border:0; background:#fff; color:#1f5d92; font-size:16px; font-weight:700; cursor:pointer;">Entsperren</button>
    </div>
  </div>
  <script>
  (function(){
    var KEY = "geko_ci_pin_ok";
    try { if (localStorage.getItem(KEY) === "1") return; } catch(e){}
    var gate = document.getElementById("ciPinGate");
    var inp  = document.getElementById("ciPinInput");
    var err  = document.getElementById("ciPinErr");
    var btn  = document.getElementById("ciPinBtn");
    if (!gate) return;
    gate.style.display = "flex";
    try { document.documentElement.style.overflow = "hidden"; } catch(e){}
    setTimeout(function(){ try { inp.focus(); } catch(e){} }, 120);
    function tryUnlock(){
      if (inp.value === "19952000") {
        try { localStorage.setItem(KEY, "1"); } catch(e){}
        gate.style.display = "none";
        try { document.documentElement.style.overflow = ""; } catch(e){}
      } else {
        err.textContent = "Falscher PIN – bitte erneut versuchen.";
        inp.value = ""; try { inp.focus(); } catch(e){}
      }
    }
    btn.addEventListener("click", tryUnlock);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); tryUnlock(); } });
  })();
  </script>

  <div class="ci-head admin-head">
    <div class="ci-head-top geko-navrow">
      <a href="hub.html" class="geko-hubbtn" title="Zur Startseite"><span class="hb-ic">⌂</span>Hub</a>
      <span class="geko-brand"><span class="dot"></span>GEKO Check-ins</span>
    </div>
    <h1>📍 Check-ins · Admin</h1>
    <div class="sub" id="ci_date">Heute</div>
  </div>

  <div class="ci-wrap admin">
    <div class="ci-body">
      <div id="view"><p class="ci-empty"><span class="spin spinner-dark"></span> Lade…</p></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/app-shared.js?v=156"></script>
  <script src="js/glas-shared.js?v=156"></script>
  <script src="js/checkins-shared.js?v=156"></script>
  <script src="js/push.js?v=156"></script>
  <script src="js/checkins-admin.js?v=156"></script>
</body>
