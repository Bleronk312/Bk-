<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Abnahmescheine" />
<meta name="theme-color" content="#1f5d92" />
<title>Abnahmescheine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-header">
    <div class="brand-row">
      <span class="dot"></span>Abnahmescheine
      <button id="pushBtn" class="btn btn-sm" style="margin-left:auto; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); color:white;" onclick="enablePushNotifications('mitarbeiter')">🔔 Benachrichtigungen</button>
    </div>
    <div class="greeting" id="greetingText">Hallo!</div>
    <div class="stat" id="headerStat">Lade...</div>
  </div>
  <div class="app-sheet">
    <img class="logo-watermark" id="watermarkImg" alt="" />
    <div class="logo-badge"><img id="badgeLogoImg" alt="Logo" /></div>
    <div class="app-sheet-content">
      <div class="wrap" style="max-width:520px; padding:0 18px 24px;">
        <div id="view"><p class="muted"><span class="spinner"></span>Lade...</p></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logo-asset.js"></script>
  <script src="js/pull-refresh.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app-shared.js"></script>
  <script src="js/push.js"></script>
  <script src="js/mitarbeiter.js"></script>
</body>
</html>
