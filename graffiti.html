  <div id="gekoAuthOverlay" style="position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#1f5d92,#132d47); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px;">Anmeldung wird gepr&uuml;ft &hellip;</div>

  <!-- Zugangsschutz: echte Anmeldung statt PIN. Das Overlay legt sich vor die
       App, bis ein angemeldeter Admin bestaetigt ist. Laeuft nach "load", weil
       geko-auth.js und supabase-js erst am Seitenende geladen werden. -->
  <script>
  (function () {
    try { localStorage.removeItem("geko_graffiti_pin_ok"); } catch (e) {}
    // Anforderungen fuer die echte Pruefung - gestartet wird sie von
    // geko-auth.js, sobald es geladen ist (nicht mehr beim "load"-Ereignis).
    window.__gekoGate = { nurAdmin: true, overlay: true, titel: "Graffiti & Sonderreinigung" };
    // Schnellstart gegen das Aufblitzen: Passt die oertlich gespeicherte
    // Anmeldung zum gemerkten Profil und erfuellt sie die Anforderung dieser
    // Seite, verschwindet der Pruef-Deckel sofort - noch bevor irgendeine
    // Bibliothek laedt. Faellt die echte Pruefung anders aus, kommt er zurueck
    // (gekoZeigeLogin/gekoZeigeSperre bauen ihn neu auf).
    try {
      var s = JSON.parse(localStorage.getItem("geko_auth") || "null");
      var p = JSON.parse(localStorage.getItem("geko_profil") || "null");
      var u = s && (s.user || (s.currentSession && s.currentSession.user));
      if (u && p && p.uid === u.id && (p.rolle === "admin")) {
        var o = document.getElementById("gekoAuthOverlay");
        if (o) o.style.display = "none";
      }
    } catch (e) {}
  })();
  </script>
