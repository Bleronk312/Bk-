<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GEKO Admin" />
<meta name="theme-color" content="#1f5d92" />
<title>Abnahmescheine - Verwaltung</title>
<link rel="stylesheet" href="css/style.css" />
<script>if(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))document.documentElement.classList.add("app-mode");</script>
</head>
<body>

  <div class="app-header">
    <div class="brand-row">
      <span class="dot"></span><span id="firmaTitle">Abnahmescheine</span>
      <a href="hub.html" class="btn btn-sm" style="margin-left:auto; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); color:white;">⌂ Hub</a>
      <button id="pushBtn" class="btn btn-sm" style="background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); color:white;" onclick="enablePushNotifications('admin')">🔔 Benachrichtigungen</button>
    </div>
    <div class="greeting" id="greetingText">Hallo!</div>
    <div class="stat" id="headerStat">Lade...</div>
  </div>
  <div class="app-sheet">
    <img class="logo-watermark" id="watermarkImg" alt="" />
    <div class="logo-badge"><img id="badgeLogoImg" alt="Logo" /></div>
    <div class="app-sheet-content">
      <div class="wrap" style="padding:0 18px 24px;">
        <div class="tabs">
          <button class="tab-btn active" id="tab-scheine" onclick="switchTab('scheine')">Scheine</button>
          <button class="tab-btn" id="tab-kunden" onclick="switchTab('kunden')">Kunden</button>
          <button class="tab-btn" id="tab-kategorien" onclick="switchTab('kategorien')">Kategorien</button>
          <button class="tab-btn" id="tab-statistik" onclick="switchTab('statistik')">Statistik</button>
          <button class="tab-btn" id="tab-archiv" onclick="switchTab('archiv')">Archiv</button>
        </div>
        <div id="view"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logo-asset.js"></script>
  <script src="js/pull-refresh.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app-shared.js"></script>
  <script src="js/push.js"></script>
  <script src="js/pdf-fonts.js"></script>
  <script src="js/pdf-template.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
